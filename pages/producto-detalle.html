<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Producto — CÓDIGO TINTO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold brand-dorado" href="../index.html">🍷 CÓDIGO TINTO</a>
      <div class="d-flex align-items-center gap-2">
        <a href="catalogo.html" class="btn btn-outline-light btn-sm">Bodega</a>
        <a href="carrito.html" class="btn btn-outline-warning btn-sm position-relative">
          🛒 Carrito <span id="cart-count" class="badge rounded-pill bg-danger">0</span>
        </a>
      </div>
    </div>
  </nav>

  <div class="container py-5" id="contenedor-detalle-producto">
    <div class="row g-5 align-items-center">
      <div class="col-md-5 text-center">
        <div class="p-3 rounded-4 prod-img-wrap" style="height: 420px; background: #130a18; border: 1px solid var(--color-borde-card);">
          <img id="detalle-img" src="../assets/img/productos/default.jpg" alt="Botella" class="img-fluid rounded" style="max-height: 100%; object-fit: contain;">
        </div>
      </div>
      <div class="col-md-7">
        <span class="badge bg-secondary mb-2" id="detalle-categoria">Cargando categoría...</span>
        <h1 class="fw-bold text-white mb-2" id="detalle-nombre">Cargando producto...</h1>
        <div class="d-flex align-items-center gap-2 mb-3">
          <span class="text-warning fs-5" id="detalle-estrellas">★★★★★</span>
          <span class="text-secondary small" id="detalle-rating-info">(Evaluaciones)</span>
        </div>
        <h2 class="text-warning fw-bold mb-4" id="detalle-precio">Bs. 0.00</h2>
        <p class="text-light lead fs-6" id="detalle-descripcion">
          Obteniendo notas de cata y detalles de elaboración...
        </p>

        <div class="p-3 rounded mb-4" style="background: #180d20; border-left: 4px solid var(--color-dorado);">
          <div class="row g-2 small">
            <div class="col-6"><strong>Cepa:</strong> <span id="detalle-cepa">-</span></div>
            <div class="col-6"><strong>Graduación:</strong> <span id="detalle-grad">-</span>% Vol.</div>
            <div class="col-6"><strong>Temporada sugerida:</strong> <span id="detalle-temporada">-</span></div>
            <div class="col-6"><strong>Disponibilidad:</strong> <span id="detalle-stock" class="badge bg-success">-</span></div>
          </div>
        </div>

        <div class="d-flex gap-3 align-items-center">
          <input type="number" id="detalle-cant" class="form-control bg-dark text-light border-secondary text-center" value="1" min="1" style="width: 80px;">
          <button class="btn btn-tinto px-4 py-2 fw-bold" id="btn-agregar-detalle">+ Añadir al Carrito</button>
          <a href="catalogo.html" class="btn btn-outline-secondary">← Volver al Catálogo</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    $(document).ready(function () {
      const urlParams = new URLSearchParams(window.location.search);
      const idProd = parseInt(urlParams.get("id")) || 1;
      let productoActual = null;

      $.ajax({
        url: `${window.API_BASE}productos.php`,
        method: "GET",
        dataType: "json",
        success: function (res) {
          if (res.status === "ok") {
            productoActual = res.data.find(p => parseInt(p.id_producto) === idProd) || res.data[0];
            if (!productoActual) return;

            $("#detalle-nombre").text(productoActual.nombre);
            $("#detalle-categoria").text(productoActual.categoria_nombre);
            $("#detalle-precio").text(`Bs. ${parseFloat(productoActual.precio).toFixed(2)}`);
            $("#detalle-descripcion").text(productoActual.descripcion || "Vino tarijeño de producción artesanal.");
            $("#detalle-cepa").text(productoActual.cepa || "Varietal");
            $("#detalle-grad").text(productoActual.graduacion_alcoholica);
            $("#detalle-temporada").text(productoActual.temporada_nombre);
            $("#detalle-stock").text(`${productoActual.stock} botellas`);
            $("#detalle-cant").attr("max", productoActual.stock);

            if (productoActual.imagen_url) {
              $("#detalle-img").attr("src", productoActual.imagen_url);
            }

            const stars = Math.round(productoActual.rating_promedio);
            $("#detalle-estrellas").text("★".repeat(stars) + "☆".repeat(5 - stars));
            $("#detalle-rating-info").text(`(${parseFloat(productoActual.rating_promedio).toFixed(1)} de 5 • ${productoActual.total_resenas} reseñas)`);
          }
        }
      });

      $("#btn-agregar-detalle").on("click", function () {
        if (!productoActual) return;
        const cant = parseInt($("#detalle-cant").val()) || 1;
        agregarAlCarrito(productoActual.id_producto, productoActual.nombre, parseFloat(productoActual.precio), cant, productoActual.imagen_url);
        
        const btn = $(this);
        btn.text(`✓ Añadido (${cant})`).addClass("btn-success").removeClass("btn-tinto");
        setTimeout(() => btn.text("+ Añadir al Carrito").removeClass("btn-success").addClass("btn-tinto"), 900);
      });
    });
  </script>
</body>
</html>
