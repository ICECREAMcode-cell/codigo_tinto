<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — CÓDIGO TINTO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="card panel-admin p-4 mx-auto shadow" style="max-width: 420px;">
      <div class="text-center mb-3">
        <a href="../index.html" class="text-decoration-none">
          <h3 class="fw-bold brand-dorado mb-0">🍷 CÓDIGO TINTO</h3>
        </a>
        <p class="text-secondary small">Autenticación de Usuarios</p>
      </div>

      <form id="form-login">
        <div class="mb-3">
          <label class="form-label small text-light">Usuario o Correo</label>
          <input type="text" id="login-usuario" class="form-control bg-dark text-light border-secondary" placeholder="usuario o correo" required>
        </div>

        <div class="mb-4">
          <label class="form-label small text-light">Contraseña</label>
          <input type="password" id="login-password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-tinto w-100 py-2 fw-bold">Ingresar al Sistema</button>

        <div class="d-flex justify-content-between align-items-center mt-3 small">
          <a href="registro.html" class="text-warning text-decoration-none">Crear cuenta (+18)</a>
          <a href="../index.html" class="text-secondary text-decoration-none">← Cancelar e ir a inicio</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
