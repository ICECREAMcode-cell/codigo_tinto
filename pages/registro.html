<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta — CÓDIGO TINTO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="card panel-admin p-4 mx-auto shadow" style="max-width: 500px;">
      <div class="text-center mb-3">
        <a href="../index.html" class="text-decoration-none">
          <h3 class="fw-bold brand-dorado mb-0">🍷 CÓDIGO TINTO</h3>
        </a>
        <p class="text-secondary small">Registro de Cliente (Venta Regulada +18 Años)</p>
      </div>

      <form id="form-registro">
        <div class="mb-3">
          <label class="form-label small text-light">Nombre de Usuario</label>
          <input type="text" id="reg-username" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Ej. CarlosFlores" required>
        </div>

        <div class="mb-3">
          <label class="form-label small text-light">Correo Electrónico</label>
          <input type="email" id="reg-correo" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small text-light">Cédula de Identidad (CI)</label>
            <input type="text" id="reg-ci" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="8492014" required>
          </div>
          <div class="col-6">
            <label class="form-label small text-light">Fecha de Nacimiento</label>
            <input type="date" id="reg-fecha-nac" class="form-control form-control-sm bg-dark text-light border-secondary" required>
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small text-light">Teléfono / WhatsApp</label>
            <input type="tel" id="reg-telefono" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="71234567">
          </div>
          <div class="col-6">
            <label class="form-label small text-light">Contraseña</label>
            <input type="password" id="reg-contrasena" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="••••••••" required>
          </div>
        </div>

        <div class="alert alert-dark border-secondary p-2 mb-3 small text-secondary">
          ⚖️ Ley N° 259: Prohibida la venta de bebidas alcohólicas a menores de 18 años.
        </div>

        <button type="submit" class="btn btn-tinto w-100 py-2 fw-bold">Verificar Edad y Registrarse</button>

        <div class="d-flex justify-content-between align-items-center mt-3 small">
          <a href="login.html" class="text-warning text-decoration-none">¿Ya tienes cuenta? Inicia sesión</a>
          <a href="../index.html" class="text-secondary text-decoration-none">← Ir al Inicio</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
