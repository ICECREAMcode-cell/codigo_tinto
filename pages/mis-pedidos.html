<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Pedidos — CÓDIGO TINTO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold brand-dorado" href="../index.html">🍷 CÓDIGO TINTO</a>
      <div class="d-flex align-items-center gap-2">
        <a href="../index.html" class="btn btn-outline-light btn-sm">🏠 Inicio</a>
        <a href="catalogo.html" class="btn btn-outline-warning btn-sm">Bodega</a>
        <div id="nav-auth-container" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </nav>

  <div class="container py-5" style="max-width: 850px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold text-white mb-0">📦 Mis Pedidos y Calificaciones</h2>
        <p class="text-secondary small mb-0">Rastreo de entregas y valoración de tus botellas.</p>
      </div>
      <button class="btn btn-outline-secondary btn-sm" onclick="cargarMisPedidos()">🔄 Actualizar</button>
    </div>

    <!-- Lista Dinámica de Pedidos -->
    <div id="contenedor-mis-pedidos">
      <div class="text-center py-5 text-secondary">Cargando compras anteriores...</div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    $(document).ready(function () {
      cargarMisPedidos();
    });

    function escapeHtml(valor) {
      return String(valor ?? "").replace(/[&<>'"]/g, function (caracter) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;"
        }[caracter];
      });
    }

    function construirBloqueResena(pedido) {
      if (pedido.estado !== "Entregado") return "";

      return `
        <div class="p-3 rounded mt-3" style="background: #24132e;">
          <h6 class="text-white mb-3">Califica los productos de este pedido</h6>
          ${pedido.productos.map((item) => {
            const resena = item.resena;
            if (resena) {
              const estrellas = "★".repeat(resena.estrellas) + "☆".repeat(5 - resena.estrellas);
              return `
                <div class="border-bottom border-secondary py-2">
                  <div class="text-light fw-bold">${escapeHtml(item.producto)}</div>
                  <div class="text-warning">${estrellas}</div>
                  ${resena.comentario ? `<div class="small text-secondary">${escapeHtml(resena.comentario)}</div>` : ""}
                  <span class="badge bg-success">Reseña publicada</span>
                </div>
              `;
            }

            return `
              <form class="form-resena border-bottom border-secondary py-3" data-pedido="${pedido.id_pedido}" data-producto="${item.id_producto}">
                <div class="text-light fw-bold mb-2">${escapeHtml(item.producto)}</div>
                <div class="d-flex gap-1 mb-2" role="radiogroup" aria-label="Calificación de ${escapeHtml(item.producto)}">
                  ${[1, 2, 3, 4, 5].map((valor) => `<button type="button" class="btn btn-sm btn-outline-warning btn-estrella" data-estrellas="${valor}" aria-label="${valor} estrellas">★</button>`).join("")}
                </div>
                <input type="hidden" class="valor-estrellas" value="0">
                <textarea class="form-control form-control-sm bg-dark text-light border-secondary mb-2" rows="2" maxlength="1000" placeholder="Comentario (opcional)"></textarea>
                <button type="submit" class="btn btn-sm btn-tinto">Publicar reseña</button>
              </form>
            `;
          }).join("")}
        </div>
      `;
    }

    function cargarMisPedidos() {
      const usuario = JSON.parse(sessionStorage.getItem("codigo_tinto_user"));
      const $cont =$("#contenedor-mis-pedidos");

      if (!usuario) {
        $cont.html(`
          <div class="alert panel-admin text-center py-4">
            <h5 class="text-warning">Inicia sesión para ver tu historial</h5>
            <a href="login.html" class="btn btn-tinto btn-sm mt-2">Ir a Iniciar Sesión</a>
          </div>
        `);
        return;
      }

      $.ajax({
        url: `${window.API_BASE}resenas.php`,
        method: "GET",
        dataType: "json",
        success: function (res) {
          $cont.empty();
          if (res.status !== "ok" || res.data.length === 0) {
            $cont.html('<div class="text-center py-5 text-muted">Aún no has realizado ningún pedido. <a href="catalogo.html" class="text-warning">Explorar bodega</a></div>');
            return;
          }

          res.data.forEach(p => {
            let badgeColor = "bg-warning text-dark";
            if (p.estado === "En camino") badgeColor = "bg-primary";
            if (p.estado === "Entregado") badgeColor = "bg-success";
            if (p.estado === "Cancelado") badgeColor = "bg-danger";

            $cont.append(`
              <div class="card card-vino p-4 mb-4 rounded-3 shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2 border-secondary">
                  <div>
                    <span class="fw-bold fs-5 text-white">Orden #${p.id_pedido}</span>
                    <span class="badge ${badgeColor} ms-2">${p.estado}</span>
                  </div>
                  <span class="text-warning fw-bold fs-5">Bs. ${parseFloat(p.total).toFixed(2)}</span>
                </div>
                <div class="text-secondary small mb-1"><strong>Fecha:</strong> ${p.fecha_pedido}</div>
                <div class="text-secondary small mb-2"><strong>Destino:</strong> ${p.direccion_referencia}</div>
                
                <div class="alert alert-dark border-secondary p-2 mb-0 small text-light d-flex justify-content-between align-items-center">
                  <span>⏱️ Tiempo estimado: <strong>${p.tiempo_estimado_min} min</strong></span>
                  <a href="factura.html?id_pedido=${p.id_pedido}" class="text-warning text-decoration-none fw-bold">Ver Factura Fiscal &rarr;</a>
                </div>

                ${construirBloqueResena(p)}
              </div>
            `);
          });
        },
        error: function (xhr) {
          const mensaje = xhr.status === 401 ? "Inicia sesión para consultar tus reseñas." : "No se pudieron cargar tus pedidos.";
          $cont.html(`<div class="alert alert-danger">${mensaje}</div>`);
        }
      });
    }

    $(document).on("click", ".btn-estrella", function () {
      const $form = $(this).closest(".form-resena");
      const valor = Number($(this).data("estrellas"));
      $form.find(".valor-estrellas").val(valor);
      $form.find(".btn-estrella").each(function () {
        const activo = Number($(this).data("estrellas")) <= valor;
        $(this).toggleClass("btn-warning text-dark", activo).toggleClass("btn-outline-warning", !activo);
      });
    });

    $(document).on("submit", ".form-resena", function (evento) {
      evento.preventDefault();
      const $form = $(this);
      const estrellas = Number($form.find(".valor-estrellas").val());
      if (estrellas < 1 || estrellas > 5) {
        alert("Selecciona una calificación de 1 a 5 estrellas.");
        return;
      }

      const $boton = $form.find("button[type='submit']");
      $boton.prop("disabled", true).text("Publicando...");
      $.ajax({
        url: `${window.API_BASE}resenas.php`,
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({
          id_pedido: Number($form.data("pedido")),
          id_producto: Number($form.data("producto")),
          estrellas: estrellas,
          comentario: $form.find("textarea").val().trim()
        }),
        success: function (res) {
          if (res.status === "ok") {
            alert("Reseña publicada correctamente.");
            cargarMisPedidos();
          } else {
            alert(res.mensaje || "No se pudo publicar la reseña.");
            $boton.prop("disabled", false).text("Publicar reseña");
          }
        },
        error: function (xhr) {
          alert(xhr.responseJSON?.mensaje || "No se pudo publicar la reseña.");
          $boton.prop("disabled", false).text("Publicar reseña");
        }
      });
    });
  </script>
</body>
</html>
