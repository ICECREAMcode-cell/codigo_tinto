<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gestión de Productos | CÓDIGO TINTO</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/custom.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold brand-dorado" href="../../index.html">
        🍷 CÓDIGO TINTO <span class="badge bg-danger ms-2 fs-6">CATÁLOGO</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="dashboard.html" class="btn btn-outline-light btn-sm">📊 Dashboard</a>
        <a href="usuarios.html" class="btn btn-outline-light btn-sm">👥 Cuentas</a>
        <a href="pedidos-envios.html" class="btn btn-outline-light btn-sm">🚚 Despachos</a>
        <a href="../catalogo.html" class="btn btn-outline-warning btn-sm">Tienda Pública</a>
        <button id="btn-logout" class="btn btn-danger btn-sm">Salir</button>
      </div>
    </div>
  </nav>

  <!-- Contenedor -->
  <div class="container-fluid px-4 py-4">
    <div class="row g-4">
      
      <!-- Formulario de Registro de Producto -->
      <div class="col-lg-4">
        <div class="card panel-admin p-4 shadow-sm text-white">
          <h4 class="fw-bold brand-dorado mb-2">➕ Registrar Producto</h4>
          <p class="text-secondary small mb-3">
            Las fotografías se redimensionan y comprimen en tu navegador antes de enviarse al servidor.
          </p>

          <form id="form-subir-producto">
            <input type="hidden" id="admin-id-producto" value="">
            <div class="mb-3">
              <label class="form-label small text-light">Nombre Comercial</label>
              <input type="text" id="admin-nombre" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Ej: Tannat Gran Reserva 2021" required>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small text-light">Categoría</label>
                <select id="admin-cat" class="form-select form-select-sm bg-dark text-light border-secondary">
                  <option value="1">Vinos Tintos</option>
                  <option value="2">Vinos Blancos</option>
                  <option value="3">Singanis</option>
                  <option value="4">Licores Artesanales</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label small text-light">Temporada</label>
                <select id="admin-temp" class="form-select form-select-sm bg-dark text-light border-secondary">
                  <option value="1">Todo el año</option>
                  <option value="2">Invierno</option>
                  <option value="3">Verano / Primavera</option>
                  <option value="4">Otoño</option>
                </select>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small text-light">Precio (Bs.)</label>
                <input type="number" step="0.50" id="admin-precio" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="85.00" required>
              </div>
              <div class="col-6">
                <label class="form-label small text-light">Stock Inicial</label>
                <input type="number" id="admin-stock" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="24" required>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small text-light">Cepa</label>
                <input type="text" id="admin-cepa" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Tannat, Moscatel...">
              </div>
              <div class="col-6">
                <label class="form-label small text-light">Graduación (% Vol)</label>
                <input type="number" step="0.1" id="admin-grad" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="14.0">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small text-light">Notas de Cata</label>
              <textarea id="admin-desc" class="form-control form-control-sm bg-dark text-light border-secondary" rows="2" placeholder="Cuerpo medio, notas a frutos rojos maduros..."></textarea>
            </div>

            <!-- Entrada de Imagen Canvas -->
            <div class="mb-3">
              <label class="form-label small text-light">Foto de la Botella</label>
              <input type="file" id="admin-foto-input" class="form-control form-control-sm bg-dark text-light border-secondary" accept="image/*" required>
              <div id="info-compresion" class="small mt-2 font-monospace"></div>
              
              <div class="text-center mt-2">
                <img id="preview-subida" src="" alt="Vista previa" class="img-thumbnail bg-dark border-secondary d-none" style="max-height: 140px;">
              </div>
            </div>

            <button type="submit" class="btn btn-tinto w-100 fw-bold">Guardar en Bodega</button>
          </form>
        </div>
      </div>

      <!-- Tabla de Productos Actuales -->
      <div class="col-lg-8">
        <div class="card panel-admin p-4 shadow-sm">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold text-white mb-0">Listado de Productos en Bodega</h4>
            <button class="btn btn-outline-secondary btn-sm" onclick="cargarProductosAdmin()">🔄 Actualizar</button>
          </div>

          <div class="table-responsive">
            <table class="table table-dark-custom align-middle" id="tabla-productos-admin">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th>Categoría</th>
                  <th>Temporada</th>
                  <th>Precio</th>
                  <th>Stock</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody>
                <!-- Se llena vía AJAX desde app.js -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Scripts CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/compresor.js"></script>
  <script src="../../assets/js/app.js?v=stock-admin-refresh-1"></script>
  <script>
    // Guardia de rol
    const usuario = JSON.parse(sessionStorage.getItem("codigo_tinto_user"));
    if (!usuario || (usuario.Rol !== "Admin" && usuario.Rol !== "SEO")) {
      alert("Acceso denegado: solo administradores.");
      window.location.href = "../login.html";
    }
  </script>
</body>
</html>
