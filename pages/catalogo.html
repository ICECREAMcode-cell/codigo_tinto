<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — CÓDIGO TINTO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom.css?v=inventory-metrics-1">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold brand-dorado" href="../index.html">🍷 CÓDIGO TINTO</a>
      <div class="d-flex align-items-center gap-2">
        <a href="../index.html" class="btn btn-outline-light btn-sm">🏠 Inicio</a>
        <a href="carrito.html" class="btn btn-outline-warning btn-sm position-relative">
          🛒 Carrito <span id="cart-count" class="badge rounded-pill bg-danger">0</span>
        </a>
        <div id="nav-auth-container" class="d-flex align-items-center gap-2">
          <a href="login.html" class="btn btn-outline-light btn-sm">Ingresar</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2 class="fw-bold text-white mb-0">Bodega de Vinos, Singanis y Licores</h2>
        <p class="text-secondary small mb-0">Selección artesanal tarijeña de gran altura.</p>
      </div>
      <a href="../index.html" class="btn btn-outline-secondary btn-sm">← Volver al Inicio</a>
    </div>

    <div class="row g-4">
      <!-- Filtros Laterales -->
      <aside class="col-lg-3">
        <div class="filter-box p-3 shadow-sm">
          <h5 class="fw-bold brand-dorado mb-3">Filtros de Búsqueda</h5>
          <div class="mb-3">
            <label class="form-label small text-secondary">Buscar por Nombre / Cepa</label>
            <input type="text" id="filtro-nombre" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Tannat, Moscatel, Singani...">
          </div>
          <div class="mb-3">
            <label class="form-label small text-secondary">Categoría</label>
            <select id="filtro-categoria" class="form-select form-select-sm bg-dark text-light border-secondary">
              <option value="todos">Todos los productos</option>
              <option value="tinto">Vinos Tintos</option>
              <option value="blanco">Vinos Blancos</option>
              <option value="singani">Singanis de Altura</option>
              <option value="licor">Licores Artesanales</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label small text-secondary">Temporada / Recomendación</label>
            <select id="filtro-epoca" class="form-select form-select-sm bg-dark text-light border-secondary">
              <option value="todas">Cualquier Época</option>
              <option value="Invierno">Recomendados de Invierno</option>
              <option value="Verano">Frescos de Verano / Primavera</option>
              <option value="Todo el año">Todo el año</option>
              <option value="Otoño">Recomendados de Otoño</option>
            </select>
          </div>
        </div>
      </aside>

      <!-- Cuadrícula de Productos -->
      <main class="col-lg-9">
        <div class="row g-2 mb-3" aria-live="polite">
          <div class="col-4">
            <div id="metrica-total" class="inventory-metric metric-neutral">
              <span>Productos</span>
              <strong id="metrica-total-valor">0</strong>
            </div>
          </div>
          <div class="col-4">
            <div id="metrica-disponibles" class="inventory-metric metric-neutral">
              <span>Disponibles</span>
              <strong id="metrica-disponibles-valor">0</strong>
            </div>
          </div>
          <div class="col-4">
            <div id="metrica-agotados" class="inventory-metric metric-neutral">
              <span>Agotados</span>
              <strong id="metrica-agotados-valor">0</strong>
            </div>
          </div>
        </div>
        <div id="alerta-stock-catalogo" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>
        <div class="row g-3" id="catalogo-grid">
          <!-- Inyección vía AJAX desde app.js -->
        </div>
      </main>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/app.js?v=catalog-detail-2"></script>
</body>
</html>
